<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - NexaCart</title>

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🛒 NexaCart</a>
<a href="shop.html" class="btn btn-warning">Continue Shopping</a>
</div>
</nav>

<div class="container my-5">

<h2 class="text-center mb-4">🛒 Your Shopping Cart</h2>

<div class="card shadow p-4">
<table class="table table-bordered text-center">
<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
</tr>
</thead>

<tbody id="cartItems">
</tbody>
</table>

<div class="text-end">
<h3>Total: <span class="text-danger" id="cartTotal">Rs. 0</span></h3>

<button class="btn btn-success mt-3">
Proceed to Checkout
</button>
</div>
</div>

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
  <p>© 2026 NexaCart | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="cart.js"></script>
</body>
</html>
