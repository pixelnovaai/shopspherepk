<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - NexaCart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🛒 NexaCart</a>
</div>
</nav>

<div class="container my-5">

<h2 class="text-center mb-4">💳 Checkout</h2>

<div class="row">

<div class="col-md-7">

<div class="card shadow p-4">

<h4>Customer Information</h4>

<div class="mb-3">
<label>Full Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>

<div class="mb-3">
<label>Phone Number</label>
<input type="text" class="form-control" placeholder="03XXXXXXXXX">
</div>

<div class="mb-3">
<label>Delivery Address</label>
<textarea class="form-control" rows="4" placeholder="Enter your complete address"></textarea>
</div>

<div class="mb-3">
<label>Payment Method</label>
<select class="form-select">
<option>Cash On Delivery</option>
<option>Bank Transfer</option>
<option>EasyPaisa</option>
<option>JazzCash</option>
</select>
</div>

<button class="btn btn-success w-100">
Place Order
</button>

</div>

</div>

<div class="col-md-5">

<div class="card shadow p-4">

<h4>Order Summary</h4>

<hr>

<p>Total Items:
<span class="float-end" id="totalItems">0</span>
</p>

<p>Total Price:
<span class="float-end text-danger" id="totalPrice">
Rs. 0
</span>
</p>

<hr>

<h5 class="text-success">
Thank you for shopping with NexaCart ❤️
</h5>

</div>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center p-3">
© 2026 NexaCart
</footer>

<script src="checkout.js"></script>

</body>
</html>
