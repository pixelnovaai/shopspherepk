<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - NexaCart</title>

<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🛒 NexaCart Admin</a>
</div>
</nav>

<div class="container my-5" style="max-width:600px;">

<div class="card shadow p-4">

<h2 class="text-center mb-4">Add New Product</h2>

<form id="productForm">
<div class="mb-3">
<label class="form-label">Product Name</label>
<input type="text" id="productName" class="form-control" placeholder="Enter product name" required>
</div>

<div class="mb-3">
<label class="form-label">Price</label>
<input type="text" id="productPrice" class="form-control" placeholder="Enter price" required>
</div>

<div class="mb-3">
<label class="form-label">Image URL</label>
<input type="text" id="productImage" class="form-control" placeholder="Paste image URL" required>
</div>

<div class="mb-3">
<label class="form-label">Affiliate Link</label>
<input type="text" id="productLink" class="form-control" placeholder="Paste affiliate link" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success">
Add Product
</button>
</div>

</form>

</div>

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
<p>© 2026 NexaCart | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
